name: 'mcpgawk MCP hygiene gate'
description: 'Fail the build when an MCP server cannot be scanned, costs too much context, or, given your committed baseline, has changed since you approved it. Runs on the runner; nothing is uploaded.'
author: 'Nativerse Ventures'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  baseline:
    description: 'Path to a committed copy of your ~/.mcpgawk/history.json (written when you scan and approve on your own machine). With it, a server that changed since that copy fails the build, and so does a server that is not in it at all. The file is only read: the scan works on a copy. Without it there is nothing to compare against, so changes are not checked.'
    required: false
    default: ''
  config:
    description: 'Path to an mcp.json config to scan. Local (stdio) servers named in it are started on the runner so they can be scanned.'
    required: false
    default: 'mcp.json'
  stdio:
    description: 'A single stdio server command to scan instead of a config (e.g. "npx -y @modelcontextprotocol/server-filesystem@2026.8.31 /tmp" — pin the version, an unpinned npx installs whatever upstream publishes next and mcpgawk flags it).'
    required: false
    default: ''
  http:
    description: 'A single streamable-HTTP MCP server URL to scan.'
    required: false
    default: ''
  sse:
    description: 'A single SSE MCP server URL to scan.'
    required: false
    default: ''
  max-tokens:
    description: 'Fail the build if any server loads more than this many tokens at connect. 0 = no budget.'
    required: false
    default: '0'
  fail-on-flagged:
    description: 'Fail the build if any server trips a bounded signal (injection-shaped / shadowing / undeclared).'
    required: false
    default: 'false'
  version:
    description: 'mcpgawk version to install from PyPI ("latest" or e.g. "0.1.2").'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install mcpgawk
      shell: bash
      # Through env, never ${{ }} inside run: — an expression is pasted into the script as code.
      env:
        MCPGAWK_VERSION: ${{ inputs.version }}
      run: |
        if [ "$MCPGAWK_VERSION" = "latest" ]; then
          pip install --quiet --disable-pip-version-check mcpgawk
        else
          pip install --quiet --disable-pip-version-check "mcpgawk==$MCPGAWK_VERSION"
        fi
    - name: Scan and gate
      shell: bash
      env:
        MCPGAWK_CONFIG: ${{ inputs.config }}
        MCPGAWK_STDIO: ${{ inputs.stdio }}
        MCPGAWK_HTTP: ${{ inputs.http }}
        MCPGAWK_SSE: ${{ inputs.sse }}
        MCPGAWK_MAX_TOKENS: ${{ inputs.max-tokens }}
        MCPGAWK_FAIL_ON_FLAGGED: ${{ inputs.fail-on-flagged }}
        MCPGAWK_BASELINE: ${{ inputs.baseline }}
      run: python "${{ github.action_path }}/scripts/ci_gate.py"
