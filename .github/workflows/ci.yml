name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run tests (incl. the structural no-egress invariant)
        # verify_live is the panel verify-button E2E: it runs the real Node engine and lives in
        # its own job below, so the fast matrix (four Python versions) does not pay for it four
        # times. Everything else, including the rest of the panel E2E, runs here.
        run: pytest -q -m "not verify_live"

  # The verify-button E2E on its own, with Node — the one panel action that actually launches and
  # watches a server. Single Python version: this exercises the TS engine, not Python-version
  # behaviour. Skips cleanly (unavailable_reason) if the bundled engine is somehow absent.
  verify-button:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Panel verify-button E2E (real engine)
        run: pytest -q -m verify_live -o addopts=""

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build

      # Same gate the publish workflow runs, on every push and PR. publish-pypi.yml is the one that
      # BLOCKS the upload; this is here so a packaging mistake goes red when it is introduced,
      # rather than first being discovered by the release that was meant to ship it.
      - name: Verify the built artefacts carry no paid code
        run: python scripts/verify_public_artifact.py dist/*.whl dist/*.tar.gz

      - name: Install the built wheel in a clean env and smoke-test the CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/mcpgawk --help

  # version-consistency lived here and compared pyproject.toml against editors/vscode/package.json.
  # Both were removed on 2026-07-21: editors/vscode was a hand-written extension that is NOT the one
  # published to Open VSX, and this job was green because those two stale sides agreed with each
  # other. The extension we ship is built from the platform repo's packages/vscode, so the check
  # moved there (platform-ci.yml, "Version consistency"), where it can see both real artefacts.
  # This repo holds the engine only; it has nothing to compare a version against.
