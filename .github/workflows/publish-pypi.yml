name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  workflow_dispatch: {}

jobs:
  # THE RELEASE GATE. Until 2026-07-21 this workflow published straight from the push: ci.yml ran
  # alongside it as an independent workflow, so a commit that broke the suite and touched
  # pyproject.toml shipped to PyPI anyway and merely turned CI red next to it. PyPI has no unpublish
  # — a bad version is permanent — so the tests must be a precondition of upload, not a parallel
  # opinion about it. This repo cannot use branch protection to express that (it is enforced on the
  # private repo's plan, and protection would not cover a workflow-dispatch run in any case), so the
  # dependency is expressed here, where it holds for every trigger.
  #
  # Same matrix as ci.yml on purpose: the engine claims >=3.10, so "the tests passed" must mean
  # passed on the oldest version we promise, not just on the newest.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Tests must pass before anything is uploaded
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    # TRUSTED PUBLISHING (2026-10-08). PyPI trusts THIS workflow in THIS repo (configured on pypi.org:
    # gawk-dev/mcpgawk, publish-pypi.yml) instead of a long-lived API token: nothing to leak, and every
    # upload carries a signed PEP 740 attestation naming the repo and workflow that built it, so a
    # user can verify where their mcpgawk came from. id-token is the only extra permission it needs.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Skip if this version is already published (re-running main shouldn't re-publish)
        run: |
          LOCAL=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          LIVE=$(python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('https://pypi.org/pypi/mcpgawk/json'))['info']['version'])" 2>/dev/null || echo "none")
          echo "local=$LOCAL live=$LIVE"
          echo "LOCAL_VERSION=$LOCAL" >> "$GITHUB_ENV"
          if [ "$LOCAL" = "$LIVE" ]; then
            echo "Already published — skipping."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          # A version OLDER than what is live is never a release — it is a bump that did not
          # happen. public_sync rewrites this file's version FROM CANONICAL, so bumping the
          # public copy is silently reverted by the next sync; twine --skip-existing then
          # skips every file and the job reports success having shipped nothing.
          OLDER=$(python -c "from packaging.version import Version; print('yes' if Version('$LOCAL') < Version('$LIVE') else 'no')" 2>/dev/null || echo no)
          if [ "$OLDER" = "yes" ]; then
            echo "::error::pyproject says $LOCAL but PyPI already serves $LIVE. Bump the version in the CANONICAL repo and re-run public_sync — bumping it here is reverted by the next sync."
            exit 1
          fi

      - run: python -m pip install --upgrade pip build
        if: env.SKIP != '1'

      - run: python -m build
        if: env.SKIP != '1'

      # THE LAST GATE BEFORE PYPI — open the box that is about to leave the building.
      #
      # Everything else that protects the paid engine is source-level or config-level, and all of it
      # lives in the PRIVATE repo: the sync allow-list, the pyproject package list, the gate tests.
      # None of that can stop an upload that happens HERE. A packaging change, a stray include, or a
      # build backend following a symlink would put `gawk_platform` in this wheel with every private
      # gate still green — and PyPI has no unpublish, so the mistake is permanent.
      #
      # So the check runs on the BUILT artefacts, in the job that uploads them, after `build` and
      # before the upload. It also fails on OVER-exclusion (a wheel with no `_bundled/verify` is a
      # broken free product) and on credential-shaped strings. Exit 2 means "could not check" and
      # is treated exactly like a failure — never publish something unverified.
      #
      # scripts/verify_public_artifact.py is kept byte-identical to the canonical copy by
      # public_sync's PUBLIC_SCRIPTS contract; it is stdlib-only, so it needs nothing installed.
      - name: Verify the built artefacts carry no paid code (blocks the upload)
        if: env.SKIP != '1'
        run: python scripts/verify_public_artifact.py dist/*.whl dist/*.tar.gz

      # skip-existing: a retry is idempotent (2026-07-23, 0.1.7: upload.pypi.org timed out AFTER both
      # files had landed — a red run over a successful publish). One retry rides out a transient
      # blip; the next step, not this one, is the evidence that a release actually shipped.
      - name: Publish to PyPI (trusted publishing, signed attestations)
        id: upload
        if: env.SKIP != '1'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Retry the upload once after a transient failure
        if: env.SKIP != '1' && steps.upload.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: PyPI must actually serve the version we just built
        if: env.SKIP != '1'
        run: |
          # An upload with skip-existing exits 0 when it uploaded NOTHING, so "upload ok" is not
          # evidence of a release. This step is the evidence: PyPI itself must name our
          # version as the current one. Without it a publish can ship nothing and still go
          # green — which is exactly what happened on 2026-08-19.
          for attempt in 1 2 3 4 5 6; do
            LIVE=$(python -c "import json,urllib.request; print(json.load(urllib.request.urlopen('https://pypi.org/pypi/mcpgawk/json'))['info']['version'])" 2>/dev/null || echo none)
            echo "attempt $attempt: pypi serves $LIVE, we built $LOCAL_VERSION"
            if [ "$LIVE" = "$LOCAL_VERSION" ]; then
              echo "confirmed: $LOCAL_VERSION is live on PyPI"
              exit 0
            fi
            sleep 20
          done
          echo "::error::the job uploaded but PyPI does not serve $LOCAL_VERSION — nothing shipped"
          exit 1
