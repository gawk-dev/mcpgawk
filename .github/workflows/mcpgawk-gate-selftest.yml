name: MCP hygiene gate (self-test)

# Dogfoods the mcpgawk Action against a real open server, so the marketplace
# listing has a live, passing example.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MCP hygiene gate
        uses: ./
        with:
          # PINNED, and that is the point. Unpinned, mcpgawk correctly raises
          # config:unpinned-package on this very example — every launch installs whatever
          # upstream publishes next (postmark-mcp shipped 15 clean versions, then v1.0.16
          # exfiltrated mail). With fail-on-flagged the gate then failed on EVERY release
          # from 0.1.35 to 0.1.40: the showcase demonstrated the mistake the product
          # detects. Pinning fixes the example and the gate at once.
          stdio: 'npx -y @modelcontextprotocol/server-filesystem@2026.8.31 /tmp'
          max-tokens: 5000
          fail-on-flagged: true
